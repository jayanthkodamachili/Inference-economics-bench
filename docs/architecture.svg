<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-label="Architecture of inference-economics-bench"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8c959f"/></marker></defs><rect width="960" height="500" fill="#ffffff"/><text x="480.0" y="26" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#1b1f23">One run produces both numbers, because one of them is useless alone</text><rect x="24" y="150" width="180" height="76" rx="6" fill="#ffffff" stroke="#57606a" stroke-width="1.5"/><text x="114.0" y="170" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#1b1f23">one corpus</text><text x="114.0" y="188" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#57606a">unigram signal plus</text><text x="114.0" y="202" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#57606a">ordered pairs a bag of</text><text x="114.0" y="216" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#57606a">words cannot see</text><rect x="276" y="60" width="196" height="40" rx="6" fill="#ffffff" stroke="#57606a" stroke-width="1.5"/><text x="374.0" y="84.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#1b1f23">majority</text><line x1="204" y1="188" x2="276" y2="80" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)"/><rect x="276" y="114" width="196" height="40" rx="6" fill="#ffffff" stroke="#57606a" stroke-width="1.5"/><text x="374.0" y="138.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#1b1f23">logreg_unigram</text><line x1="204" y1="188" x2="276" y2="134" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)"/><rect x="276" y="168" width="196" height="40" rx="6" fill="#ffffff" stroke="#57606a" stroke-width="1.5"/><text x="374.0" y="192.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#1b1f23">logreg_ngram2</text><line x1="204" y1="188" x2="276" y2="188" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)"/><rect x="276" y="222" width="196" height="40" rx="6" fill="#ffffff" stroke="#57606a" stroke-width="1.5"/><text x="374.0" y="246.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#1b1f23">transformer</text><line x1="204" y1="188" x2="276" y2="242" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)"/><rect x="276" y="276" width="196" height="40" rx="6" fill="#ffffff" stroke="#57606a" stroke-width="1.5"/><text x="374.0" y="300.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#1b1f23">svd_boosting</text><line x1="204" y1="188" x2="276" y2="296" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)"/><text x="374" y="352" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#57606a">all five take a string, so all five pay to parse it</text><rect x="540" y="96" width="180" height="54" rx="6" fill="#ffffff" stroke="#57606a" stroke-width="1.5"/><text x="630.0" y="116" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#1b1f23">accuracy</text><text x="630.0" y="134" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#57606a">deterministic</text><rect x="540" y="186" width="180" height="54" rx="6" fill="#ffffff" stroke="#57606a" stroke-width="1.5"/><text x="630.0" y="206" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#1b1f23">cost per call</text><text x="630.0" y="224" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#57606a">latency x machine price</text><line x1="472" y1="80" x2="540" y2="123" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)"/><line x1="472" y1="80" x2="540" y2="213" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)"/><line x1="472" y1="134" x2="540" y2="123" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)"/><line x1="472" y1="134" x2="540" y2="213" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)"/><line x1="472" y1="188" x2="540" y2="123" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)"/><line x1="472" y1="188" x2="540" y2="213" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)"/><line x1="472" y1="242" x2="540" y2="123" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)"/><line x1="472" y1="242" x2="540" y2="213" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)"/><line x1="472" y1="296" x2="540" y2="123" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)"/><line x1="472" y1="296" x2="540" y2="213" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)"/><rect x="778" y="140" width="158" height="70" rx="6" fill="#f2fbf4" stroke="#116329" stroke-width="1.5"/><text x="857.0" y="160" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#1b1f23">the frontier</text><text x="857.0" y="178" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#57606a">who is dominated,</text><text x="857.0" y="192" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#57606a">and at what budget</text><line x1="720" y1="123" x2="778" y2="165" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)"/><line x1="720" y1="213" x2="778" y2="185" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)"/><text x="857" y="232" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#b42318">exit 4: dominated</text><rect x="130" y="400" width="700" height="66" rx="6" fill="#ffffff" stroke="#57606a" stroke-width="1.5"/><text x="480.0" y="420" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#1b1f23">ranked by accuracy and ranked by cost are not the same ranking</text><text x="480.0" y="438" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#57606a">the most accurate model here costs 33 times what the next one does, for two accuracy points</text><line x1="857" y1="210" x2="700" y2="400" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)"/><line x1="630" y1="240" x2="420" y2="400" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)"/></svg>
